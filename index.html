<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Hub | Home</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- RED NAVBAR -->
    <div id="navbar-container"></div>

    <!-- HERO POSTER SECTION -->
    <section class="hero">
      <!-- Giant Background Text -->
      <!-- Added scroll-hidden to fade the text in -->
      <div class="massive-text scroll-hidden">
        <h1 class="solid-text">BLOOD</h1>
        <h1 class="outline-text">STRIKE</h1>
      </div>

      <!-- Character Image -->
      <!-- Added scroll-hidden so Zero slides up and fades in -->
      <img
        src="assets/zerohome.png"
        alt="Hero Character"
        class="character-img scroll-hidden" />

      <!-- Bottom Banner -->
      <!-- Added scroll-hidden to bring the banner up from the bottom -->
      <div class="bottom-banner">
        <p>WITNESS THE REAL POWER OF THE SHADOW // LET ME CLEAR THE WAY</p>
      </div>
    </section>

    <script src="js/script.js"></script>
  </body>
</html>
