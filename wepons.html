<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Hub | Weapons</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- JavaScript injects your Navbar here -->
    <div id="navbar-container"></div>

    <!-- FEATURED ARSENAL NOTICE BANNER -->
    <div class="arsenal-notice-wrapper">
      <div class="arsenal-notice-card">
        <h2 class="notice-title">FEATURED ARSENAL</h2>
        <p class="notice-desc">
          Showing a curated showcase of featured elite guns with legendary
          skins. Stay tuned for future weapon additions!
        </p>
      </div>
    </div>

    <!-- WEAPON 1: M4-A1 -->
    <div class="showcase-wrapper">
      <div class="character-showcase-card">
        <div class="character-text">
          <h1 class="outline-text-left">ASSAULT</h1>
          <h1 class="solid-text-left">M4-A1</h1>
          <p class="character-tags">RELIABLE // ZERO-RECOIL</p>

          <!-- Weapon Stat Bars -->
          <div class="weapon-stats">
            <div class="stat-row">
              <span>DAMAGE</span>
              <div class="stat-bar">
                <div class="fill" style="width: 75%"></div>
              </div>
            </div>
            <div class="stat-row">
              <span>FIRE RATE</span>
              <div class="stat-bar">
                <div class="fill" style="width: 60%"></div>
              </div>
            </div>
            <div class="stat-row">
              <span>MOBILITY</span>
              <div class="stat-bar">
                <div class="fill" style="width: 50%"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="character-visual">
          <img
            src="assets/m4.png"
            alt="M4-A1"
            class="showcase-img floating-weapon" />
        </div>
      </div>
    </div>

    <!-- WEAPON 2: URB (Reversed Layout) -->
    <div class="showcase-wrapper">
      <div class="character-showcase-card reverse">
        <div class="character-text">
          <h1 class="outline-text-left">SMG</h1>
          <h1 class="solid-text-left">URB</h1>
          <p class="character-tags">HIGH-FIRE-RATE // CLOSE-QUARTERS</p>

          <div class="weapon-stats">
            <div class="stat-row">
              <span>DAMAGE</span>
              <div class="stat-bar">
                <div class="fill" style="width: 45%"></div>
              </div>
            </div>
            <div class="stat-row">
              <span>FIRE RATE</span>
              <div class="stat-bar">
                <div class="fill" style="width: 90%"></div>
              </div>
            </div>
            <div class="stat-row">
              <span>MOBILITY</span>
              <div class="stat-bar">
                <div class="fill" style="width: 85%"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="character-visual">
          <img
            src="assets/spear.png"
            alt="URB"
            class="showcase-img floating-weapon" />
        </div>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
